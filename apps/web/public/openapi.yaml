openapi: 3.1.0
info:
  title: Ksapi API
  version: 0.1.0
  description: |
    Store API and inference gateway for prepaid API keys. The selected package amount becomes the key's USDT balance. Pay in RUB through YooKassa or in USDT on TON through NOWPayments.
    OpenAI-compatible, Anthropic Messages, and Gemini requests draw from this shared balance.
    The gateway does not store prompt or response bodies and accepts stateless requests.
servers:
  - url: http://localhost:8080
    description: Local Colima/Docker Compose
  - url: https://your-domain.example
    description: Production
tags:
  - name: Health
  - name: Authentication
  - name: Store
  - name: Keys
  - name: Admin
  - name: OpenAI proxy
  - name: Anthropic Messages
  - name: Gemini
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Process liveness
      operationId: getLiveness
      responses:
        '200':
          description: The API process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSeconds]
                properties:
                  status: { const: ok }
                  uptimeSeconds: { type: integer, minimum: 0 }
  /health/ready:
    get:
      tags: [Health]
      summary: Database and upstream readiness
      operationId: getReadiness
      responses:
        '200':
          description: The service can accept traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: PostgreSQL or the required schema is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /health/serving:
    get:
      tags: [Health]
      summary: Check for at least one verified, priced upstream key
      operationId: getServingStatus
      responses:
        '200':
          description: A verified upstream key is available for inference; sale capacity is separate.
          content:
            application/json:
              schema:
                type: object
                properties: { status: { const: available } }
        '503':
          description: No verified upstream key is available, or PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                type: object
                properties: { status: { const: unavailable } }
  /api/config:
    get:
      tags: [Store]
      summary: Public storefront configuration
      operationId: getConfig
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  appName: { type: string }
                  paymentCurrencies:
                    type: array
                    items: { enum: [USDT, RUB] }
                    description: Enabled checkout currencies. The initial production release enables USDT only.
                  paymentMethods:
                    type: array
                    items: { enum: [yookassa, nowpayments, ton, mock] }
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Create a customer account and session
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Create a session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Destroy the current session
      operationId: logout
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session destroyed }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Current user
      operationId: getCurrentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Error' }
  /api/profile:
    patch:
      tags: [Authentication]
      summary: Update profile, locale, theme, and optional public wallet address
      operationId: updateProfile
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/products:
    get:
      tags: [Store]
      summary: List products with live sale inventory
      operationId: listProducts
      responses:
        '200':
          description: Products and enabled payment methods
          content:
            application/json:
              schema:
                type: object
                required: [products, paymentMethods, paymentCurrencies]
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  paymentCurrencies:
                    type: array
                    items: { enum: [USDT, RUB] }
                  paymentMethods:
                    type: array
                    items: { enum: [yookassa, nowpayments, ton, mock] }
                  cryptoCurrency:
                    type: [string, 'null']
                    description: USDT when crypto checkout is enabled.
                  cryptoNetwork: { type: [string, 'null'], enum: [TON, null] }
                  currency: { const: USDT }
  /api/price-rates:
    get:
      tags: [Store]
      summary: Get the USDT to RUB exchange rate
      operationId: getPriceRates
      responses:
        '200':
          description: Indicative rates. When rates are unavailable, the rates field is null. Checkout uses the currency and amount from the order or payment invoice.
          content:
            application/json:
              schema:
                type: object
                required: [rates]
                properties:
                  rates:
                    type: [object, 'null']
                    required: [usdtToRub, checkedAt, source]
                    properties:
                      usdtToRub: { type: string, example: '82.40000000' }
                      source: { enum: [coingecko, configured] }
                      checkedAt: { type: string, format: date-time }
  /api/products/{id}/estimate:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags: [Store]
      summary: Estimate the USDT charge for a text or image request at the current retail rate
      operationId: estimateProductUsage
      parameters:
        - { name: model, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: inputTokens, in: query, schema: { type: integer, minimum: 0, maximum: 1100000, default: 0 } }
        - name: cachedInputTokens
          in: query
          description: Subset of input tokens billed at the cached rate.
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - { name: cacheWrite5mTokens, in: query, description: Claude input tokens written to the five-minute cache., schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { name: cacheWrite1hTokens, in: query, description: Claude input tokens written to the one-hour cache., schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { name: outputTokens, in: query, schema: { type: integer, minimum: 0, maximum: 128000, default: 0 } }
        - { name: videoSeconds, in: query, description: Allowed video duration., schema: { type: integer, minimum: 1, maximum: 120 } }
        - { name: imageCount, in: query, description: Number of images for an image model (defaults to one)., schema: { type: integer, minimum: 1, maximum: 10 } }
      responses:
        '200':
          description: Estimated charge and number of equivalent requests for the package balance. Charges can be lower when a less expensive channel is selected.
          content:
            application/json:
              schema:
                type: object
                required: [cost, requestsPerKey, longContextApplied, peakApplied]
                properties:
                  currency: { const: USDT }
                  cost: { type: string, description: Estimated USDT charge per request, example: '0.00364000' }
                  requestsPerKey: { type: [string, 'null'], description: The package price divided by cost and rounded down. Null if cost is zero., example: '5494' }
                  longContextApplied: { type: boolean }
                  peakApplied: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/orders:
    get:
      tags: [Store]
      summary: List the current user's orders
      operationId: listOrders
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Store]
      summary: Create a one-time checkout for a new key or an existing key top-up
      description: >-
        Omit topUpKeyId to buy a new API key. Include the ID of an owned, eligible key
        to add the selected USDT amount to its balance after payment confirmation. YooKassa charges RUB at a locked exchange rate; NOWPayments charges USDT on TON. Key IDs
        are available from GET /api/keys. The key secret and existing usage stay attached to the same key.
      operationId: createOrder
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, paymentProvider]
              properties:
                productId: { type: string, format: uuid }
                paymentProvider: { enum: [yookassa, nowpayments, ton, mock] }
                paymentCurrency:
                  type: string
                  enum: [RUB, USDT]
                  description: Payment currency. YooKassa supports RUB, NOWPayments supports USDT, and local mock payments support both. If omitted, defaults to RUB for YooKassa and USDT otherwise. The server locks the RUB exchange rate when creating the invoice; the key balance is always credited in USDT.
                topUpKeyId: { type: string, format: uuid }
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Error' }
  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags: [Store]
      summary: Get one of the current user's orders
      operationId: getOrder
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Error' }
  /api/payments/mock/{orderId}/complete:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Store]
      summary: Complete a local-only mock checkout
      operationId: completeMockPayment
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Order fulfilled idempotently
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { const: true } }
        '404': { $ref: '#/components/responses/Error' }
  /api/keys:
    get:
      tags: [Keys]
      summary: List the current user's prepaid API keys
      operationId: listKeys
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Keys; plaintext secrets are never returned here
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
  /api/keys/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags: [Keys]
      summary: Get request history for one of the signed-in user's keys
      operationId: listKeyUsage
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - name: before
          in: query
          description: Pass the previous page's nextCursor to read earlier requests.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Newest first. Each row contains request metadata and the amount charged to the key.
          content:
            application/json:
              schema:
                type: object
                required: [usage, nextCursor]
                properties:
                  usage:
                    type: array
                    items: { $ref: '#/components/schemas/UsageRecord' }
                  nextCursor: { type: [string, 'null'], format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/keys/{id}/reveal:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags: [Keys]
      summary: Reveal a key after password re-authentication
      operationId: revealKey
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/Password'
      responses:
        '200': { $ref: '#/components/responses/PlaintextKey' }
        '401': { $ref: '#/components/responses/Error' }
  /api/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags: [Keys]
      summary: Replace a downstream key after password re-authentication
      operationId: rotateKey
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/Password'
      responses:
        '200': { $ref: '#/components/responses/PlaintextKey' }
        '401': { $ref: '#/components/responses/Error' }
  /api/keys/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    post:
      tags: [Keys]
      summary: Permanently revoke a downstream key
      operationId: revokeKey
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Key revoked }
        '404': { $ref: '#/components/responses/Error' }
  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Commercial and operational summary
      operationId: getAdminStats
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/provider-balances:
    get:
      tags: [Admin]
      summary: Provider account balances and low-balance notification status
      description: Administrator only. Balance is the last successful provider API reading, never a sum of local key limits. Stale or failed checks retain the last reading and expose its timestamp and error.
      operationId: getProviderBalances
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Monitoring settings and account balances
          content:
            application/json:
              schema:
                type: object
                required: [monitoring, balances]
                properties:
                  monitoring:
                    type: object
                    properties:
                      ceEnabled: { type: boolean }
                      intervalMs: { type: integer }
                      smtpConfigured: { type: boolean }
                      lowThresholdUsd: { type: string }
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        balanceUsd: { type: [string, 'null'] }
                        lowThresholdUsd: { type: string }
                        checkedAt: { type: [string, 'null'], format: date-time }
                        lastAttemptAt: { type: string, format: date-time }
                        lastError: { type: [string, 'null'] }
                        lowSince: { type: [string, 'null'], format: date-time }
                        enabled: { type: boolean }
                        lowBalance: { type: boolean }
                        stale: { type: boolean }
                        notificationStatus: { type: [string, 'null'], enum: [PENDING, SENT, CANCELLED, null] }
                        notificationError: { type: [string, 'null'] }
                        lastNotifiedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/pools:
    get:
      tags: [Admin]
      summary: List provider pools
      operationId: listProviderPools
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Provider pools }
    post:
      tags: [Admin]
      summary: Create an OpenAI-compatible provider pool
      operationId: createProviderPool
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderPoolInput' }
      responses:
        '201': { description: Pool created }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/pools/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    patch:
      tags: [Admin]
      summary: Update a provider pool
      operationId: updateProviderPool
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderPoolInput' }
      responses:
        '200': { description: Pool updated }
  /api/admin/credentials:
    get:
      tags: [Admin]
      summary: List encrypted upstream credentials and their health
      operationId: listUpstreamCredentials
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Credential metadata; plaintext is never returned }
  /api/admin/pools/{poolId}/credentials:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Add an encrypted upstream API key
      operationId: createUpstreamCredential
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, apiKey]
              properties:
                label: { type: string, minLength: 2 }
                apiKey: { type: string, minLength: 8, writeOnly: true }
                priority: { type: integer, default: 100 }
                maxConcurrency: { type: integer, minimum: 1, default: 8 }
                spendLimit: { type: [string, 'null'], pattern: '^\d+(\.\d+)?$' }
                testOnly: { type: boolean, default: false, description: Credential may only serve mock orders in the local mock-only environment. }
      responses:
        '201': { description: Credential encrypted and stored }
  /api/admin/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    patch:
      tags: [Admin]
      summary: Rotate, enable, disable, or limit an upstream credential
      operationId: updateUpstreamCredential
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Credential updated }
  /api/admin/products:
    get:
      tags: [Admin]
      summary: List products
      operationId: listAdminProducts
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Products }
    post:
      tags: [Admin]
      summary: Create a prepaid key product
      operationId: createProduct
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Product created }
  /api/admin/rates:
    get:
      tags: [Admin]
      summary: List provider model rates
      operationId: listModelRates
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Rates }
    post:
      tags: [Admin]
      summary: Create or update a provider model rate
      operationId: upsertModelRate
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poolId, model, inputPerMillion, outputPerMillion, cachedInputPerMillion]
              properties:
                poolId: { type: string, format: uuid }
                model: { type: string, minLength: 1, maxLength: 200 }
                inputPerMillion: { type: string, description: Wholesale input token price per million. }
                outputPerMillion: { type: string, description: Wholesale output token price per million. }
                cachedInputPerMillion: { type: string }
                perRequest: { type: string, default: '0', description: Wholesale price per returned image. }
                perSecond: { type: string, default: '0', description: Positive for VIDEOS; token and perRequest prices must be zero for video. }
                mediaOptions:
                  type: object
                  description: All allowed variants must have the same price. VIDEOS requires seconds as a list of integers from 1 to 120; image editing requires operations containing edit. Configured price options must be explicitly specified by the client.
                  propertyNames: { enum: [seconds, size, quality, background, input_fidelity, resolution, aspect_ratio, audio, operations] }
                  additionalProperties:
                    type: array
                    minItems: 1
                    maxItems: 30
                    items: { type: [string, number, boolean] }
                longContextThreshold: { type: [integer, 'null'], minimum: 1, default: null }
                longContextMultiplier: { type: string, default: '1' }
                peakMultiplier: { type: number, minimum: 1, maximum: 10 }
                active: { type: boolean, default: true }
      responses:
        '200': { description: Rate saved }
        '400': { $ref: '#/components/responses/Error' }
  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Users }
  /api/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    patch:
      tags: [Admin]
      summary: Change user role or status
      operationId: updateUser
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: User updated }
  /api/admin/orders:
    get:
      tags: [Admin]
      summary: List all orders
      operationId: listAdminOrders
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Orders }
  /v1/models:
    get:
      tags: [OpenAI proxy]
      summary: List the verified and priced models this key can currently use, with their protocol codes
      operationId: proxyModels
      security: [{ downstreamKey: [] }]
      responses:
        '200':
          description: OpenAI-compatible model list. The protocols array identifies the APIs accepted for each model.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/OpenAIError' }
        '503': { $ref: '#/components/responses/OpenAIError' }
  /v1/responses:
    post:
      tags: [OpenAI proxy]
      summary: Stateless Responses API with client-side tools and SSE
      description: Stored response IDs, conversations, hosted tools and background jobs are not supported. Send full history or use compaction if the provider implements it.
      operationId: proxyResponses
      security: [{ downstreamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              additionalProperties: true
              properties:
                model: { type: string }
                input: {}
                stream: { type: boolean }
                prompt_cache_key: { type: string }
                max_output_tokens: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/OpenAIProxyResponse' }
        '402': { $ref: '#/components/responses/OpenAIError' }
        '429': { $ref: '#/components/responses/OpenAIError' }
        '502': { $ref: '#/components/responses/OpenAIError' }
        '503': { $ref: '#/components/responses/OpenAIError' }
  /v1/responses/compact:
    post:
      tags: [OpenAI proxy]
      summary: Metered stateless context compaction
      description: Available only if the assigned provider supports this route. Keep the returned compacted items unchanged for the next request.
      operationId: proxyCompactResponse
      security: [{ downstreamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              additionalProperties: true
              properties:
                model: { type: string }
                input: {}
      responses:
        '200': { $ref: '#/components/responses/OpenAIProxyResponse' }
        '402': { $ref: '#/components/responses/OpenAIError' }
        '404': { $ref: '#/components/responses/OpenAIError' }
        '503': { $ref: '#/components/responses/OpenAIError' }
  /v1/chat/completions:
    post:
      tags: [OpenAI proxy]
      summary: OpenAI-compatible Chat Completions, including tools and SSE
      operationId: proxyChatCompletions
      security: [{ downstreamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              additionalProperties: true
              properties:
                model: { type: string }
                messages: { type: array, items: {} }
                stream: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/OpenAIProxyResponse' }
        '402': { $ref: '#/components/responses/OpenAIError' }
        '429': { $ref: '#/components/responses/OpenAIError' }
        '502': { $ref: '#/components/responses/OpenAIError' }
  /v1/images/generations:
    post:
      tags: [OpenAI proxy]
      summary: Non-streaming JSON image generation on a priced image group
      operationId: proxyImageGeneration
      security: [{ downstreamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              additionalProperties: true
              properties:
                model: { type: string }
                prompt: { type: string }
                n: { type: integer, minimum: 1, maximum: 10, default: 1 }
      responses:
        '200': { $ref: '#/components/responses/OpenAIProxyResponse' }
  /v1/messages:
    post:
      tags: [Anthropic Messages]
      summary: Claude Messages with client-side tools and optional SSE
      operationId: proxyAnthropicMessages
      security: [{ downstreamKey: [] }, { anthropicKey: [] }]
      parameters:
        - { name: anthropic-version, in: header, schema: { type: string, default: '2023-06-01' } }
        - { name: anthropic-beta, in: header, schema: { type: string } }
        - { name: beta, in: query, schema: { const: 'true' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, max_tokens]
              properties:
                model: { type: string }
                messages: { type: array, items: { type: object } }
                max_tokens: { type: integer, minimum: 1 }
                stream: { type: boolean }
                tools: { type: array, items: { type: object } }
            example: { model: claude-opus-5-5, messages: [{ role: user, content: 'Hello' }], max_tokens: 512 }
      responses:
        '200': { $ref: '#/components/responses/OpenAIProxyResponse' }
        default:
          description: Anthropic error envelope (type=error, error.type and error.message)
  /v1beta/models:
    get:
      tags: [Gemini]
      summary: List Gemini models this key can currently use
      operationId: proxyGeminiModels
      security: [{ downstreamKey: [] }, { geminiKey: [] }]
      responses:
        '200':
          description: Gemini model list
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: 'models/gemini-3.1-pro' }
                        displayName: { type: string }
                        supportedGenerationMethods: { type: array, items: { type: string } }
  /v1beta/models/{model}:generateContent:
    parameters: [{ $ref: '#/components/parameters/GeminiModel' }]
    post:
      tags: [Gemini]
      summary: Generate a Gemini response as JSON
      operationId: proxyGeminiGenerate
      security: [{ downstreamKey: [] }, { geminiKey: [] }]
      requestBody: { $ref: '#/components/requestBodies/GeminiContent' }
      responses:
        '200': { $ref: '#/components/responses/OpenAIProxyResponse' }
        default: { description: Gemini error envelope with error.code and error.status }
  /v1beta/models/{model}:streamGenerateContent:
    parameters: [{ $ref: '#/components/parameters/GeminiModel' }]
    post:
      tags: [Gemini]
      summary: Stream a Gemini response as SSE
      operationId: proxyGeminiStream
      security: [{ downstreamKey: [] }, { geminiKey: [] }]
      parameters:
        - { name: alt, in: query, schema: { const: sse } }
      requestBody: { $ref: '#/components/requestBodies/GeminiContent' }
      responses:
        '200': { $ref: '#/components/responses/OpenAIProxyResponse' }
        default: { description: Gemini error envelope with error.code and error.status }
  /api/admin/provider-keys:
    get:
      tags: [Admin]
      operationId: listProviderKeys
      summary: List the CE key inventory, remaining quotas and linked customer balances
      description: Admin-only snapshot. Full API keys and fingerprints are never returned. Inspect sync.stale before treating a balance as current.
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: activeOnly, schema: { type: boolean, default: true } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Inventory snapshot and synchronization status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderInventoryKey' }
                  sync:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      stale: { type: boolean }
                      requested: { type: boolean }
                      intervalMs: { type: integer }
                      accountId: { type: [string, 'null'] }
                      checkedAt: { type: [string, 'null'], format: date-time }
                      attemptedAt: { type: [string, 'null'], format: date-time }
                      lastError: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/provider-keys/refresh:
    post:
      tags: [Admin]
      operationId: requestProviderKeyRefresh
      summary: Queue a CE inventory refresh for the worker
      security: [{ sessionCookie: [] }]
      responses:
        '202':
          description: Refresh queued; poll the inventory endpoint for completion.
          content:
            application/json:
              schema: { type: object, properties: { queued: { const: true } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: CE_KEY_SYNC_ENABLED is disabled. }
  /api/admin/users/{id}/keys:
    parameters:
      - $ref: '#/components/parameters/UuidId'
    get:
      tags: [Admin]
      operationId: listAdminUserKeys
      summary: List a customer's keys, USDT balances and provider assignments
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: activeOnly, schema: { type: boolean, default: true } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Customer balances and distinct primary or model-channel assignments; provider balances may be shared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object, properties: { id: { type: string, format: uuid }, email: { type: string }, name: { type: [string, 'null'] } } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCustomerKey' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/webhooks/yookassa:
    post:
      tags: [Store]
      operationId: confirmYooKassaPayment
      summary: Reconcile a YooKassa payment notification against the authenticated provider API
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, event, object]
              properties:
                type: { const: notification }
                event: { type: string, example: payment.succeeded }
                object:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
      responses:
        '200': { description: Payment verified or notification ignored; repeats are idempotent. }
        '400': { description: Invalid notification or payment does not match the saved order. }
        '502': { description: Provider unavailable or returned invalid payment data; retry delivery. }
        '503': { description: Payment API unavailable or checkout not saved yet; retry delivery. }
  /api/orders/{id}/payment-claim:
    post:
      tags: [Store]
      summary: Submit a TON transaction hash for manual review; does not credit a payment
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionHash]
              properties:
                transactionHash: { type: string, minLength: 43, maxLength: 64 }
      responses:
        '200': { description: Review request saved for the authenticated order owner }
        '404': { description: Unpaid TON order not found }
  /api/admin/payments/ton:
    get:
      tags: [Admin]
      summary: TON wallet configuration, scan health, verified receipts and customer review requests
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Up to 200 latest receipts and open orders; requires ADMIN }
  /api/admin/payments/ton/inspect:
    post:
      tags: [Admin]
      summary: Fetch and verify finalized USDT actions by transaction hash from TON Center
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, transactionHash]
              properties:
                orderId: { type: string, format: uuid }
                transactionHash: { type: string, minLength: 43, maxLength: 64 }
      responses:
        '200': { description: Verified receipts saved; exact invoice matches may be credited automatically }
        '409': { description: No finalized USDT transfer to the invoice wallet }
        '503': { description: Indexer unavailable; no unverified payment credited }
  /api/admin/payments/ton/{id}/review:
    post:
      tags: [Admin]
      summary: Approve or reject an indexed TON receipt with an audited reason
      description: Approval requires a full payment to the invoice wallet after order creation. A transfer cannot be reused. Rejecting does not initiate an on-chain refund.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { enum: [approve, reject] }
                orderId: { type: string, format: uuid, description: Required when the receipt has no matched invoice }
                note: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '200': { description: Decision committed atomically with order payment and audit log }
        '409': { description: Underpaid, reused, mismatched or already settled payment }
  /api/webhooks/nowpayments:
    post:
      tags: [Store]
      operationId: confirmNowPaymentsPayment
      summary: Verify the signed IPN and reconcile a full USDT-on-TON payment
      security: []
      parameters:
        - in: header
          name: x-nowpayments-sig
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Signed notification accepted; repeats are idempotent. }
        '400': { description: Invalid signature, coin, amount or payment ID. }
        '503': { description: Checkout not saved yet; retry delivery. }

  /v1/models/{model}:
    parameters: [{ $ref: '#/components/parameters/GeminiModel' }]
    get:
      tags: [OpenAI proxy]
      operationId: retrieveModel
      summary: Retrieve an available model (Anthropic envelope when using Anthropic headers)
      security: [{ downstreamKey: [] }, { anthropicKey: [] }]
      responses:
        '200': { description: Model metadata }
        '404': { $ref: '#/components/responses/OpenAIError' }
  /v1beta/models/{model}:
    parameters: [{ $ref: '#/components/parameters/GeminiModel' }]
    get:
      tags: [Gemini]
      operationId: retrieveGeminiModel
      summary: Retrieve Gemini model metadata
      security: [{ downstreamKey: [] }, { geminiKey: [] }]
      responses:
        '200': { description: Gemini model }
  /v1/messages/count_tokens:
    post:
      tags: [Anthropic Messages]
      operationId: countAnthropicTokens
      summary: Count input tokens without a balance debit
      description: Requires an active funded key and a provider supporting this method. Uses the same model routing and concurrency limits as Messages.
      security: [{ downstreamKey: [] }, { anthropicKey: [] }]
      parameters:
        - { name: anthropic-version, in: header, schema: { type: string, default: '2023-06-01' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [model, messages], additionalProperties: true }
      responses:
        '200':
          description: Token count
          content:
            application/json:
              schema: { type: object, required: [input_tokens], properties: { input_tokens: { type: integer, minimum: 0 } } }
  /v1beta/models/{model}:countTokens:
    parameters: [{ $ref: '#/components/parameters/GeminiModel' }]
    post:
      tags: [Gemini]
      operationId: countGeminiTokens
      summary: Count inline Gemini input without a balance debit
      security: [{ downstreamKey: [] }, { geminiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contents: { type: array, items: { type: object } }
                generateContentRequest: { type: object, description: Inline request; any model must match the URL. }
      responses:
        '200':
          description: Token count
          content:
            application/json:
              schema: { type: object, required: [totalTokens], properties: { totalTokens: { type: integer, minimum: 0 } } }
  /v1/images/edits:
    post:
      tags: [OpenAI proxy]
      operationId: editImage
      summary: Edit images with JSON references or SDK multipart uploads
      description: Requires operations containing edit in the published model mediaOptions. Only PNG/JPEG/WebP uploads (at most 16 images, total request 32 MiB). No upstream file IDs. No streaming. The per-image price covers only configured size/quality options.
      security: [{ downstreamKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model: { type: string }
                prompt: { type: string, minLength: 1, maxLength: 32000 }
                image: { type: string, description: HTTPS image URL or data URI; alternatively use images. }
                images: { type: array, minItems: 1, maxItems: 16, items: { type: object, properties: { image_url: { type: string } } } }
                n: { type: integer, minimum: 1, maximum: 10, default: 1 }
          multipart/form-data:
            schema:
              type: object
              required: [model, prompt, image]
              properties:
                model: { type: string }
                prompt: { type: string }
                image: { type: string, format: binary }
                mask: { type: string, format: binary }
                n: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200': { $ref: '#/components/responses/OpenAIProxyResponse' }
        '400': { $ref: '#/components/responses/OpenAIError' }
  /v1/videos:
    post:
      tags: [Videos]
      operationId: createVideo
      summary: Create a video job and reserve its quoted price
      description: Compatible job lifecycle for providers implementing these routes; not a promise that a particular provider/model is available. Select an available VIDEOS model. No stored upstream file IDs. Completed jobs are charged once per confirmed second; failed jobs release the hold. Ambiguous submissions return a job with billing_status=review_required; keep its ID and contact support. Do not retry creation with a new idempotency key.
      security: [{ downstreamKey: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, description: Recommended; reuse only for the same request. Scoped to this customer key., schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoCreate' }
          multipart/form-data:
            schema:
              allOf:
                - { $ref: '#/components/schemas/VideoCreate' }
                - { type: object, properties: { input_reference: { type: string, format: binary } } }
      responses:
        '200': { $ref: '#/components/responses/VideoJobResponse' }
        '400': { $ref: '#/components/responses/OpenAIError' }
        '402': { $ref: '#/components/responses/OpenAIError' }
        '409': { $ref: '#/components/responses/OpenAIError' }
        '429': { $ref: '#/components/responses/OpenAIError' }
    get:
      tags: [Videos]
      operationId: listVideos
      summary: List only the calling key's jobs; no charge
      security: [{ downstreamKey: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: after, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Paginated owned jobs with data and has_more
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/VideoJob' } }, has_more: { type: boolean } } }
  /v1/videos/{id}:
    parameters: [{ $ref: '#/components/parameters/VideoId' }]
    get:
      tags: [Videos]
      operationId: retrieveVideo
      summary: Retrieve job status; no additional charge
      security: [{ downstreamKey: [] }]
      responses:
        '200': { $ref: '#/components/responses/VideoJobResponse' }
        '404': { $ref: '#/components/responses/OpenAIError' }
  /v1/videos/{id}/content:
    parameters: [{ $ref: '#/components/parameters/VideoId' }]
    get:
      tags: [Videos]
      operationId: downloadVideo
      summary: Download an owned completed video (also allowed for an exhausted key)
      description: Streams at most 512 MiB without exposing provider URLs or credentials. Does not follow provider redirects. Revoked keys and suspended users cannot download.
      security: [{ downstreamKey: [] }]
      parameters:
        - { name: variant, in: query, schema: { enum: [video, thumbnail, spritesheet], default: video } }
        - { name: Range, in: header, schema: { type: string }, description: Single byte range. }
      responses:
        '200': { description: Video or image bytes, content: { video/mp4: { schema: { type: string, format: binary } } } }
        '206': { description: Partial content }
        '404': { $ref: '#/components/responses/OpenAIError' }
        '409': { $ref: '#/components/responses/OpenAIError' }
        '410': { $ref: '#/components/responses/OpenAIError' }
  /api/admin/videos:
    get:
      tags: [Admin]
      operationId: listAdminVideos
      summary: Recent jobs, reservations and unresolved outcomes
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Admin-only jobs }
  /api/admin/videos/{id}/reconcile:
    parameters: [{ $ref: '#/components/parameters/UuidId' }]
    post:
      tags: [Admin]
      operationId: reconcileVideo
      summary: Verify the provider result or release a review reservation with an audit reason
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { enum: [refresh, release] }
                upstreamId: { type: string, maxLength: 200 }
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '200': { description: Updated video }
        '409': { description: Already settled or provider result mismatch }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: proxy_session
    downstreamKey:
      type: http
      scheme: bearer
      bearerFormat: Ksapi
    anthropicKey: { type: apiKey, in: header, name: x-api-key }
    geminiKey: { type: apiKey, in: header, name: x-goog-api-key }
  parameters:
    VideoId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^video_[a-f0-9-]{36}$' }
    UuidId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GeminiModel:
      name: model
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,200}$' }
  requestBodies:
    GeminiContent:
      description: Inline contents only. The model is selected in the path. Keys must be sent in headers.
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [contents]
            properties:
              contents: { type: array, items: { type: object } }
              generationConfig: { type: object }
              tools: { type: array, items: { type: object } }
          example: { contents: [{ parts: [{ text: 'Hello' }] }] }
    Password:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password: { type: string, writeOnly: true }
  responses:
    VideoJobResponse:
      description: Owned job with a public video ID; no provider identifiers.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VideoJob' }
    Error:
      description: Application error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    OpenAIError:
      description: Gateway or provider error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PlaintextKey:
      description: Plaintext downstream key; handle as a secret
      content:
        application/json:
          schema:
            type: object
            required: [apiKey]
            properties:
              apiKey: { type: string, writeOnly: true, pattern: '^pk_' }
    OpenAIProxyResponse:
      description: Response in the selected API's JSON or SSE format
      headers:
        x-proxy-request-id:
          schema: { type: string }
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
        text/event-stream:
          schema: { type: string }
  schemas:
    VideoCreate:
      type: object
      required: [model, prompt, seconds]
      properties:
        model: { type: string, maxLength: 200 }
        prompt: { type: string, minLength: 1, maxLength: 32000 }
        seconds: { type: [string, integer], description: Must be present in the model mediaOptions.seconds; maximum 120. }
        size: { type: string, description: An explicitly priced resolution; required when configured for the model. }
    VideoJob:
      type: object
      required: [id, object, model, seconds, status, billing_status, progress, created_at]
      properties:
        id: { type: string, pattern: '^video_[a-f0-9-]{36}$' }
        object: { const: video }
        model: { type: string }
        seconds: { type: string }
        size: { type: [string, 'null'] }
        status: { enum: [queued, in_progress, completed, failed] }
        billing_status: { enum: [reserved, charged, released, review_required] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        created_at: { type: integer }
        completed_at: { type: [integer, 'null'] }
        expires_at: { type: [integer, 'null'] }
        error: { type: [object, 'null'] }
    ProviderInventoryKey:
      type: object
      properties:
        externalId: { type: string }
        accountId: { type: string }
        name: { type: string }
        keyHint: { type: string, description: Masked key hint only. }
        groupId: { type: [string, 'null'] }
        groupName: { type: [string, 'null'] }
        status: { type: string }
        active: { type: boolean, description: Present, enabled, not expired and with remaining individual quota or no individual limit. }
        present: { type: boolean }
        quotaUsd: { type: [string, 'null'], description: Null means no individual key quota; account or subscription limits still apply. }
        quotaUsedUsd: { type: string }
        remainingUsd: { type: [string, 'null'], description: Shared provider balance; never sum once per customer. }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        checkedAt: { type: string, format: date-time }
        credentialId: { type: [string, 'null'], format: uuid }
        credentialLabel: { type: [string, 'null'] }
        customerKeys:
          type: array
          items:
            type: object
            properties:
              keyId: { type: string, format: uuid }
              keyHint: { type: string }
              label: { type: string }
              userId: { type: string, format: uuid }
              email: { type: string }
              remainingUsdt: { type: string }
    AdminCustomerKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        keyHint: { type: string }
        status: { type: string }
        active: { type: boolean }
        currency: { const: USDT }
        creditsTotal: { type: string }
        creditsUsed: { type: string }
        reservedCredits: { type: string, description: Balance held for unfinished requests and video jobs. }
        remainingUsdt: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        upstreams:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              keyHint: { type: string }
              providerName: { type: string }
              status: { type: string }
              localRemainingUsd: { type: [string, 'null'], description: Ksapi accounting; not a fresh provider confirmation. }
              externalId: { type: [string, 'null'] }
              remoteStatus: { type: [string, 'null'] }
              remotePresent: { type: [boolean, 'null'] }
              remoteQuotaUsd: { type: [string, 'null'] }
              remoteUsedUsd: { type: [string, 'null'] }
              remoteRemainingUsd: { type: [string, 'null'] }
              remoteExpiresAt: { type: [string, 'null'], format: date-time }
              remoteCheckedAt: { type: [string, 'null'], format: date-time }
              remoteStale: { type: boolean }
              sharedKeyCount: { type: integer }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            type: { type: string }
            details: {}
    Readiness:
      type: object
      required: [status, database]
      properties:
        status: { enum: [ready, not_ready] }
        database:
          type: object
          additionalProperties: true
        upstream:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, writeOnly: true }
    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/LoginRequest'
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 2, maxLength: 100 }
    ProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        walletNetwork: { type: [string, 'null'], maxLength: 50 }
        walletAddress: { type: [string, 'null'], maxLength: 256, description: Public address only }
        locale: { enum: [ru, en] }
        theme: { enum: [SYSTEM, LIGHT, DARK] }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        role: { enum: [ADMIN, USER] }
        walletNetwork: { type: [string, 'null'] }
        walletAddress: { type: [string, 'null'] }
        locale: { enum: [ru, en] }
        theme: { enum: [SYSTEM, LIGHT, DARK] }
        createdAt: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    Product:
      type: object
      required: [id, name, usageAllowance, retailPrice, inventory, models, unpricedModels]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        usageAllowance: { type: string, description: Prepaid USDT balance equal to the selected package amount. }
        retailPrice: { type: string }
        currency: { const: USDT }
        durationDays: { type: [integer, 'null'] }
        concurrencyLimit: { type: integer }
        inventory: { type: integer, minimum: 0 }
        models:
          type: array
          items: { $ref: '#/components/schemas/PublicModelRate' }
        unpricedModels:
          type: array
          description: Observed or documented models with no published rate; these cannot be called.
          items: { $ref: '#/components/schemas/ModelOption' }
    ModelOption:
      type: object
      required: [model, protocol]
      properties:
        model: { type: string }
        protocol:
          enum: [OPENAI, OPENAI_CHAT, ANTHROPIC, GEMINI, IMAGES, VIDEOS]
    PublicModelRate:
      type: object
      required: [model, protocol, available, inputPerMillion, cachedInputPerMillion, outputPerMillion, perRequest, perSecond, mediaOptions, longContextThreshold, longContextMultiplier, peakMultiplier]
      properties:
        model: { type: string }
        protocol: { enum: [OPENAI, OPENAI_CHAT, ANTHROPIC, GEMINI, IMAGES, VIDEOS] }
        available: { type: boolean, description: The model appeared in a currently verified catalog for the package. }
        inputPerMillion: { type: string }
        cachedInputPerMillion: { type: string }
        outputPerMillion: { type: string }
        perRequest: { type: string }
        perSecond: { type: string, description: Price per completed video second in USDT. }
        mediaOptions:
          type: object
          additionalProperties: { type: array, items: { type: [string, number, boolean] } }
          description: Allowed explicitly priced parameters. Video durations are seconds; edits require operations containing edit.
        longContextThreshold: { type: [integer, 'null'] }
        longContextMultiplier: { type: string }
        peakMultiplier: { type: string, description: 'Multiplier for token charges on weekdays 01:00–04:00 and 06:00–10:00 UTC.' }
    Order:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        status: { enum: [PENDING, PAID, FULFILLED, FAILED, EXPIRED, REFUNDED] }
        paymentProvider: { enum: [yookassa, nowpayments, ton, mock, stripe], description: Stripe is supported only for historical orders. }
        amount: { type: string, description: Amount charged in the payment currency. }
        currency: { type: string, description: RUB or USDT for new orders; original currency for historical orders. }
        creditAmount: { type: string, description: USDT credited exactly once after payment confirmation. }
        usdtRubRate: { type: [string, 'null'], description: RUB per USDT locked when a RUB invoice is created. }
        exchangeRateAt: { type: [string, 'null'], format: date-time }
        metadata:
          type: object
          additionalProperties: true
          properties:
            asset: { const: USDT }
            network: { const: TON }
            payAmount: { type: [string, number] }
            payAddress: { type: string }
            payinExtraId: { type: [string, 'null'] }
            testPayment: { type: boolean, description: YooKassa test-mode payment. }
        checkoutUrl: { type: [string, 'null'], format: uri }
        reservedUntil: { type: string, format: date-time }
        topUpKeyId: { type: [string, 'null'], format: uuid }
        apiKeyId: { type: [string, 'null'], format: uuid, description: Issued or topped-up key after fulfillment. }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        keyHint: { type: string }
        status: { enum: [ACTIVE, PAUSED, EXHAUSTED, EXPIRED, REVOKED] }
        currency: { const: USDT }
        creditsTotal: { type: string, description: Total USDT credited by the purchase and confirmed top-ups. }
        creditsUsed: { type: string, description: Total USDT charged to the key. }
        concurrencyLimit: { type: integer }
        expiresAt: { type: [string, 'null'], format: date-time, description: Null for a key that does not expire. }
        testKey: { type: boolean }
        topUpProductIds:
          type: array
          description: Package IDs that are compatible with this key.
          items: { type: string, format: uuid }
        models:
          type: array
          description: Currently verified and priced models with a compatible channel available to this key.
          items: { type: string }
        modelOptions:
          type: array
          items: { $ref: '#/components/schemas/ModelOption' }
    UsageRecord:
      type: object
      required: [id, requestId, endpoint, inputTokens, outputTokens, cachedInputTokens, cost, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string }
        endpoint: { type: string }
        model: { type: [string, 'null'] }
        inputTokens: { type: string }
        outputTokens: { type: string }
        cachedInputTokens: { type: string }
        cacheWrite5mTokens: { type: string }
        cacheWrite1hTokens: { type: string }
        imageCount: { type: integer }
        videoSeconds: { type: integer }
        cost: { type: string, description: USDT charged from the key's allowance. }
        status: { enum: [STARTED, SUCCEEDED, FAILED, CANCELLED] }
        httpStatus: { type: [integer, 'null'] }
        errorCode: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    ProviderPoolInput:
      type: object
      required: [name, slug, baseUrl, credentialCapacity]
      properties:
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        baseUrl: { type: string, format: uri, description: A trailing /v1 or /v1beta is normalized automatically. }
        credentialCapacity: { type: integer, minimum: 1, description: Sold customer keys per upstream credential }
        parentPoolId: { type: [string, 'null'], format: uuid, description: Optional standalone pool that shares this channel with its packages. }
        protocol: { enum: [OPENAI, OPENAI_CHAT, ANTHROPIC, GEMINI, IMAGES, VIDEOS], default: OPENAI }
        routingPriority: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        active: { type: boolean, default: true }
