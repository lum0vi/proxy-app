groups:
  - name: proxiapp-health
    rules:
      - alert: ProxiAppDown
        expr: up{job="proxiapp"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Ksapi API is unavailable
          description: Prometheus could not scrape the API for two minutes.

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: PostgreSQL is unavailable
          description: Orders, authentication, and proxy accounting cannot proceed.

      - alert: HighProxyErrorRate
        expr: |
          sum(rate(proxiapp_proxy_requests_total{status=~"5..|UPSTREAM_.*"}[5m]))
          / clamp_min(sum(rate(proxiapp_proxy_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: AI proxy error rate is above 5%

      - alert: HighProxyP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(proxiapp_proxy_request_duration_seconds_bucket[10m]))) > 30
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: AI proxy p95 latency is above 30 seconds

      - alert: NodeEventLoopSaturated
        expr: proxiapp_nodejs_eventloop_lag_p99_seconds > 0.25
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Node.js event loop p99 lag is above 250ms

      - alert: ProviderCapacityExhausted
        expr: proxiapp_upstream_customer_key_capacity{kind="sellable"} <= 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Provider pool {{ $labels.provider }} has no sale capacity

      - alert: PaidOrdersWaitingForKey
        expr: proxiapp_pending_orders{status="paid"} > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Confirmed orders are still waiting for keys

      - alert: ProviderAccountLowBalance
        expr: |
          (proxiapp_provider_account_balance_usd <= proxiapp_provider_account_low_balance_threshold_usd)
          and on (provider) (proxiapp_provider_account_balance_check_healthy == 1)
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: Provider account {{ $labels.provider }} balance is low
          description: Top up the provider account. Remaining balance is {{ $value }} USD.

      - alert: ProviderAccountBalanceCheckFailed
        expr: proxiapp_provider_account_balance_check_healthy == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Provider account {{ $labels.provider }} balance is unknown or stale
          description: Check worker health and provider management credentials.

      - alert: UsageRequiresReconciliation
        expr: sum by (provider) (increase(proxiapp_proxy_accounting_anomalies_total[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: Review unconfirmed or unposted upstream usage for {{ $labels.provider }}
      - alert: TonPaymentScannerStale
        expr: (proxiapp_ton_scan_lag_seconds > 600 or proxiapp_ton_scan_errors > 0) and on() (proxiapp_ton_monitor_enabled == 1)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "USDT TON payment verification is delayed or failing"
          description: "Check the worker, TON Center API key and the payment desk before accepting more payments."
      - alert: TonPaymentsNeedReview
        expr: proxiapp_ton_payments_review > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "USDT transfers need administrator review"
          description: "Open Admin → Orders to resolve unmatched, late, underpaid or overpaid transfers."
      - alert: VideoJobsNeedReview
        expr: proxiapp_video_jobs{state="REVIEW"} > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Video jobs have unconfirmed billing"
          description: "Open Admin → Providers → Video jobs. Confirm the provider result or release the reservation."
      - alert: VideoPollingStale
        expr: proxiapp_video_poll_lag_seconds > 300
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "Video status checks are delayed"
          description: "Check worker health and the video provider. Pending jobs retain their balance reservation."
